# SPDX-License-Identifier: MPL-2.0
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "8"
      - name: Remember Java 8 for launcher smoke
        run: echo "CCT_SMOKE_JAVA8_ROOT=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
      - run: ./gradlew --no-daemon --console=plain build
      - run: python3 scripts/test_summary.py
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Package tested CLI
        run: |
          ./gradlew --no-daemon --console=plain :cli:distZip
          echo "CCT_VERSION=$(./gradlew --no-daemon -q printVersion)" >> "$GITHUB_ENV"
      - name: Smoke the release zip
        env:
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          unzip -q "cli/build/distributions/cct-run-$CCT_VERSION.zip" -d "$RUNNER_TEMP/cct-zip"
          dist="$RUNNER_TEMP/cct-zip/cct-run-$CCT_VERSION"
          bash "$dist/scripts/smoke-test.sh" "$dist/bin/cct-run" "$GITHUB_WORKSPACE/build/reports/cct-run-smoke-report.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cct-run
          path: cli/build/distributions/cct-run-${{ env.CCT_VERSION }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-reports-cli
          path: |
            engine/build/test-results/test/*.xml
            cli/build/test-results/test/*.xml
            build/reports/cct-run-smoke-report.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success()
        with:
          name: junit-cli
          path: |
            engine/build/test-results/test/*.xml
            cli/build/test-results/test/*.xml
  mod:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [forge, neoforge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
      - run: ./gradlew --no-daemon --console=plain :mod-${{ matrix.variant }}:build
        env:
          GRADLE_OPTS: -Xmx3g
      - name: Select explicit jar name
        run: |
          version=$(./gradlew --no-daemon -q printVersion)
          mc=1.20.1
          if [ "${{ matrix.variant }}" = neoforge ]; then mc=1.21.1; fi
          echo "CCT_JAR=mod/${{ matrix.variant }}/build/libs/cct-live-$mc-$version.jar" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cct-live-${{ matrix.variant }}
          path: ${{ env.CCT_JAR }}
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: junit-${{ matrix.variant }}
          path: mod/${{ matrix.variant }}/build/test-results/test/*.xml
          if-no-files-found: ignore
  verification:
    needs: [tests, mod]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: junit-cli
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: junit-forge
          path: mod/forge/build/test-results/test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: junit-neoforge
          path: mod/neoforge/build/test-results/test
      - run: python3 scripts/test_summary.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification
          path: build/reports/verification.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, mod, verification]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Check tag before downloading assets
        run: ./gradlew --no-daemon --console=plain verifyReleaseVersion
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: cct-*
          path: build/release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verification
          path: build/release
      - name: Publish the tested bytes without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          args=()
          notes="docs/release-notes-$version.md"
          if [ -f "$notes" ]; then args+=(--notes "$notes"); fi
          python3 scripts/release_assets.py "$GITHUB_REF_NAME" \
            "build/release/cct-run-$version.zip" \
            "build/release/cct-live-1.20.1-$version.jar" \
            "build/release/cct-live-1.21.1-$version.jar" \
            --verification build/release/verification.json "${args[@]}"
